# TD-BE-2 - pytest broad-collection cleanup (2A-D.3 technical-debt note,
# SHOULD-FIX). Confines default collection to tests/.
#
# Why: bare `pytest` from the repo root used to collect the stray legacy
# files app/ops_rls_test.py and app/tests/test_rate_limit.py. Collecting
# them inserts app/ onto sys.path, which makes the nested legacy package
# app/app/__init__.py shadow the real top-level `app` package and breaks
# imports for the entire run (20 collection errors). The stray files are
# left untouched (no behaviour change); default collection simply no
# longer wanders into them. Explicit paths (e.g. `pytest app/tests/...`)
# still behave exactly as before.
[pytest]
testpaths = tests
norecursedirs = .venv .git app docs migrations scripts tools
